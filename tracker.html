<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Time | Digital Detox</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="tracker">
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="index.html">◉ <strong>Digital Detox</strong></a>
      <nav>
        <a class="nav-link" href="index.html" data-nav="home">⌂ <span data-i18n="home">الرئيسية</span></a>
        <a class="nav-link" href="tracker.html" data-nav="tracker">◷ <span data-i18n="tracker">وقت الشاشة</span></a>
        <a class="nav-link" href="goals.html" data-nav="goals">◎ <span data-i18n="goals">الأهداف</span></a>
        <a class="nav-link" href="challenges.html" data-nav="challenges">✦ <span data-i18n="challenges">التحديات</span></a>
        <a class="nav-link" href="statistics.html" data-nav="statistics">▥ <span data-i18n="statistics">الإحصائيات</span></a>
      </nav>
      <p class="sidebar-note" data-i18n="sidebarNote">خطوات صغيرة بتعمل فرق كبير.</p>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n="trackerLabel">متابعة الوقت</p>
          <h1 data-i18n="trackerTitle">وقت الشاشة</h1>
        </div>
        <button class="language-button" id="languageButton">English</button>
      </header>

      <section class="card">
        <h2 data-i18n="logScreenTime">سجل وقت الشاشة</h2>
        <p class="muted" data-i18n="trackerDescription">أضف الوقت اللي استخدمت فيه أجهزتك النهارده.</p>
        <form id="timeForm">
          <label for="minutesInput" data-i18n="minutesLabel">عدد الدقايق</label>
          <div class="form-row">
            <input id="minutesInput" type="number" min="1" max="1440" placeholder="٤٥" required>
            <button type="submit" data-i18n="addTime">أضف الوقت</button>
          </div>
        </form>
        <p class="message" id="trackerMessage" aria-live="polite"></p>
      </section>

      <section class="card">
        <div class="section-title">
          <h2 data-i18n="todaysEntries">تسجيلات النهارده</h2>
          <span class="pill" id="entryCount">0</span>
        </div>
        <p class="total-time"><span data-i18n="totalToday">الإجمالي النهارده:</span> <strong id="trackerTotal">٠ د</strong></p>
        <ul class="entry-list" id="entryList"></ul>
      </section>
    </main>
  </div>
</body>
</html>
